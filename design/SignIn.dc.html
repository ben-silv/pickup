<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pickup · Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500..800&amp;family=Montserrat:wght@400..800&amp;family=Archivo:wdth,wght@62..125,400..900&amp;display=swap">
<style>
body{margin:0}
.pk{font-family:'Montserrat',Arial,sans-serif;color:#002E6D;-webkit-font-smoothing:antialiased}
.pk .d{font-family:'Playfair Display',Georgia,serif;font-weight:600;letter-spacing:-0.01em;line-height:1.05;margin:0;text-wrap:balance}
.pk .m{font-family:'Archivo','Arial Narrow',sans-serif;font-stretch:78%;font-weight:700;letter-spacing:.07em;text-transform:uppercase;font-size:13px;line-height:1.4}
.pk p{margin:0}
.pk input,.pk button{font:inherit}
.pk .glass{background:linear-gradient(180deg,rgba(255,255,255,.78) 0%,rgba(255,255,255,.58) 100%);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),inset 0 0 24px rgba(255,255,255,.3),0 24px 60px rgba(0,30,80,.25)}
.pk .glass-dark{background:linear-gradient(180deg,rgba(24,74,146,.80) 0%,rgba(0,46,109,.88) 100%);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.14),inset 0 0 14px rgba(120,170,235,.25),0 8px 24px rgba(0,30,80,.25);color:#FFFFFF}
.pk a:focus-visible,.pk button:focus-visible,.pk input:focus-visible{outline:3px solid #002E6D;outline-offset:3px}
a{color:#002E6D}a:hover{color:#3E8EDE}
</style>
</helmet>
<div class="pk" style="width: 100%; min-height: 900px; background: #3E8EDE; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 16px; box-sizing: border-box">
  <!-- Shapes behind the glass so the blur has something to bend -->
  <div aria-hidden="true" style="position: absolute; width: 520px; height: 520px; border-radius: 50%; background: #002E6D; left: calc(50% - 520px); top: 80px"></div>
  <div aria-hidden="true" style="position: absolute; width: 320px; height: 320px; border-radius: 50%; background: #CFE2F6; left: calc(50% + 120px); top: 460px"></div>

  <a href="Landing.dc.html" style="position: absolute; top: 32px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 26px; text-decoration: none; color: #FFFFFF">
    <span aria-hidden="true" style="width: 15px; height: 15px; border-radius: 50%; background: #002E6D; box-shadow: 19px 0 0 #FFFFFF; display: inline-block"></span>
    <span class="d" style="font-size: 26px; color: #FFFFFF">Pickup</span>
  </a>

  <section class="glass" style="position: relative; width: 100%; max-width: 460px; box-sizing: border-box; border-radius: 36px; padding: clamp(28px, 5vw, 44px); display: flex; flex-direction: column; gap: 22px">
    <sc-if value="{{entering}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 22px">
        <div style="display: flex; flex-direction: column; gap: 10px">
          <h1 class="d" style="font-size: 38px">Sign in</h1>
          <p style="font-size: 16px; line-height: 1.55; color: #33476B">Use your Tufts email. We’ll send a one-time link, so there’s no password to remember.</p>
        </div>
        <label style="display: flex; flex-direction: column; gap: 8px; font-weight: 600; font-size: 15px">Tufts email
          <input type="email" value="{{email}}" onChange="{{onEmail}}" placeholder="you@tufts.edu" aria-invalid="{{invalid}}" style="border: 1.5px solid {{fieldBorder}}; background: rgba(255,255,255,0.85); border-radius: 16px; padding: 15px 16px; font-size: 17px; color: #002E6D">
        </label>
        <sc-if value="{{showError}}" hint-placeholder-val="{{false}}">
          <p role="alert" style="font-size: 15px; font-weight: 700; color: #A3201C; margin-top: -8px">Use your @tufts.edu address.</p>
        </sc-if>
        <button type="button" onClick="{{submit}}" class="glass-dark" style="font-weight: 700; font-size: 17px; padding: 16px 24px; border-radius: 999px; cursor: pointer">Email me a sign-in link</button>
        <p style="font-size: 14px; line-height: 1.5; color: #33476B">New here? The same link creates your account.</p>
      </div>
    </sc-if>
    <sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 18px">
        <span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 50%; background: #002E6D; display: grid; place-items: center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></svg>
        </span>
        <h1 class="d" style="font-size: 36px">Check your inbox</h1>
        <p style="font-size: 16px; line-height: 1.55; color: #33476B">We sent a sign-in link to <strong>{{email}}</strong>. It works for 15 minutes.</p>
        <div style="display: flex; flex-wrap: wrap; gap: 10px">
          <a href="Feed.dc.html" class="glass-dark" style="text-decoration: none; font-weight: 700; font-size: 15px; padding: 13px 20px; border-radius: 999px">Open the app (demo)</a>
          <button type="button" onClick="{{back}}" style="border: 0; background: transparent; color: #002E6D; font-weight: 700; font-size: 15px; text-decoration: underline; cursor: pointer; padding: 13px 4px">Use a different email</button>
        </div>
      </div>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { email: '', sent: false, tried: false };
  }
  renderVals() {
    const ok = /^[^@\s]+@tufts\.edu$/i.test(this.state.email.trim());
    const showError = this.state.tried && !ok;
    return {
      email: this.state.email,
      entering: !this.state.sent,
      sent: this.state.sent,
      showError,
      invalid: showError ? 'true' : 'false',
      fieldBorder: showError ? '#A3201C' : '#D9DEE7',
      onEmail: (e) => this.setState({ email: e.target.value }),
      submit: () => (ok ? this.setState({ sent: true, tried: false }) : this.setState({ tried: true })),
      back: () => this.setState({ sent: false })
    };
  }
}
</script>
</body>
</html>
